@if (loading()) {
  <div style="text-align:center;padding:2rem;color:hsl(var(--muted-foreground))">Loading...</div>
} @else {
  <div style="max-width:56rem;margin:0 auto;display:flex;flex-direction:column;gap:1.5rem">
    <div style="display:flex;align-items:center;gap:1rem">
      <a [routerLink]="['/projects', projectId, 'test-cases', testCaseId]" style="color:hsl(var(--muted-foreground));text-decoration:none;display:flex">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
      <h1 style="font-size:1.875rem;font-weight:700">Edit Test Case</h1>
    </div>

    <div class="card">
      <h2 style="font-size:0.875rem;font-weight:600;margin-bottom:1rem">Basic Info</h2>
      <div style="display:flex;flex-direction:column;gap:1rem">
        <div><label class="label">Title *</label><input class="input" [ngModel]="title()" (ngModelChange)="title.set($event)" /></div>
        <div><label class="label">Description</label><textarea class="input" rows="3" [ngModel]="description()" (ngModelChange)="description.set($event)"></textarea></div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem">
          <div>
            <label class="label">Priority</label>
            <select class="input" [ngModel]="priority()" (ngModelChange)="priority.set($event)">
              <option value="critical">Critical</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option>
            </select>
          </div>
          <div>
            <label class="label">Status</label>
            <select class="input" [ngModel]="status()" (ngModelChange)="status.set($event)">
              <option value="draft">Draft</option><option value="active">Active</option><option value="deprecated">Deprecated</option>
            </select>
          </div>
          <div>
            <label class="label">Automation</label>
            <select class="input" [ngModel]="automationStatus()" (ngModelChange)="automationStatus.set($event)">
              <option value="manual">Manual</option><option value="automated">Automated</option><option value="semi-automated">Semi-automated</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 style="font-size:0.875rem;font-weight:600;margin-bottom:1rem">Labels</h2>
      <div style="display:flex;gap:0.5rem;margin-bottom:0.75rem">
        <input class="input" [ngModel]="labelInput()" (ngModelChange)="labelInput.set($event)" (keydown.enter)="addLabel()" placeholder="Add a label and press Enter" style="flex:1" />
        <button class="btn btn-outline btn-sm" (click)="addLabel()">Add</button>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem">
        @for (label of labels(); track label) {
          <span class="badge">{{ label }}<button (click)="removeLabel(label)" style="border:none;background:none;cursor:pointer;color:inherit;padding:0 0 0 0.25rem;line-height:1">×</button></span>
        }
      </div>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
        <h2 style="font-size:0.875rem;font-weight:600">Test Steps</h2>
        <button class="btn btn-outline btn-sm" (click)="addStep()">+ Add Step</button>
      </div>
      @for (step of steps(); track $index; let i = $index) {
        <div style="display:grid;grid-template-columns:auto 1fr 1fr auto;gap:0.75rem;align-items:start;margin-bottom:0.75rem">
          <span style="padding:0.5rem 0;font-size:0.75rem;color:hsl(var(--muted-foreground));width:1.5rem;text-align:center">{{ i + 1 }}</span>
          <div><label class="label" style="font-size:0.75rem">Action</label><input class="input" [ngModel]="step.action" (ngModelChange)="updateStep(i, 'action', $event)" /></div>
          <div><label class="label" style="font-size:0.75rem">Expected</label><input class="input" [ngModel]="step.expected" (ngModelChange)="updateStep(i, 'expected', $event)" /></div>
          <button class="btn btn-ghost btn-sm btn-icon" (click)="removeStep(i)" style="color:hsl(var(--destructive));margin-top:1.5rem">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </button>
        </div>
      }
      @if (steps().length === 0) {
        <div style="text-align:center;padding:2rem;color:hsl(var(--muted-foreground));font-size:0.875rem;border:2px dashed hsl(var(--border));border-radius:var(--radius)">No steps.</div>
      }
    </div>

    <div style="display:flex;justify-content:flex-end;gap:0.75rem">
      <a [routerLink]="['/projects', projectId, 'test-cases', testCaseId]" class="btn btn-outline">Cancel</a>
      <button class="btn btn-primary" (click)="submit()" [disabled]="saving()">{{ saving() ? 'Saving...' : 'Save Changes' }}</button>
    </div>
  </div>
}
