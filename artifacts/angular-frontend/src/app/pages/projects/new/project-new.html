<div class="max-w-2xl mx-auto" style="display:flex;flex-direction:column;gap:1.5rem;max-width:40rem">
  <div style="display:flex;align-items:center;gap:1rem">
    <a routerLink="/projects" style="color:hsl(var(--muted-foreground));text-decoration:none;display:flex" title="Back">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>
    <h1 style="font-size:1.875rem;font-weight:700">New Project</h1>
  </div>

  <div class="card">
    <h2 style="font-size:1rem;font-weight:600;margin-bottom:1rem">Project Details</h2>
    <div style="display:flex;flex-direction:column;gap:1rem">
      <div>
        <label class="label">Name *</label>
        <input class="input" [ngModel]="name()" (ngModelChange)="name.set($event)" placeholder="e.g. Frontend E2E Tests" />
      </div>
      <div>
        <label class="label">Description</label>
        <textarea class="input" rows="3" [ngModel]="description()" (ngModelChange)="description.set($event)" placeholder="Describe what this project tests..."></textarea>
      </div>
      <div>
        <label class="label">Repository URL</label>
        <input class="input" [ngModel]="repoUrl()" (ngModelChange)="repoUrl.set($event)" placeholder="https://github.com/org/repo" />
      </div>
      <div>
        <label class="label">Default Branch</label>
        <input class="input" [ngModel]="branch()" (ngModelChange)="branch.set($event)" placeholder="main" />
      </div>
    </div>
  </div>

  <div style="display:flex;justify-content:flex-end;gap:0.75rem">
    <a routerLink="/projects" class="btn btn-outline">Cancel</a>
    <button class="btn btn-primary" (click)="submit()" [disabled]="saving()">
      {{ saving() ? 'Creating...' : 'Create Project' }}
    </button>
  </div>
</div>
