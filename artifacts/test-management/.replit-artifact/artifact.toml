kind = "web"
previewPath = "/"
title = "Test Management Platform"
version = "1.0.0"
id = "artifacts/test-management"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21478

[services.development]
run = "pnpm --filter @workspace/angular-frontend run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/angular-frontend", "run", "build" ]
publicDir = "artifacts/angular-frontend/dist/angular-frontend/browser"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21478"
BASE_PATH = "/"
